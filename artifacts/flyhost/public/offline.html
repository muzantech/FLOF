<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FlyHost — Hors ligne</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: #09090B;
      color: #FAFAFA;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
    }
    .card {
      max-width: 400px;
      background: rgba(20,20,28,0.9);
      border: 1px solid rgba(250,204,21,0.15);
      border-radius: 24px;
      padding: 48px 36px;
    }
    .logo {
      width: 56px; height: 56px;
      background: #FACC15;
      border-radius: 14px;
      display: flex; align-items: center; justify-content: center;
      font-size: 24px; font-weight: 900; color: #09090B;
      margin: 0 auto 24px;
    }
    h1 { font-size: 22px; font-weight: 800; margin-bottom: 10px; }
    p { font-size: 14px; color: #71717A; line-height: 1.7; margin-bottom: 28px; }
    button {
      background: #FACC15; color: #09090B;
      border: none; border-radius: 50px;
      padding: 12px 28px; font-size: 15px; font-weight: 700;
      cursor: pointer; transition: opacity 0.2s;
    }
    button:hover { opacity: 0.85; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">F</div>
    <h1>Vous êtes hors ligne</h1>
    <p>Impossible de charger FlyHost pour l'instant. Vérifiez votre connexion internet et réessayez.</p>
    <button onclick="window.location.reload()">🔄 Réessayer</button>
  </div>
</body>
</html>
