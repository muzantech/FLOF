kind = "web"
previewPath = "/"
title = "FlyHost - Plateforme d'hébergement"
version = "1.0.0"
id = "artifacts/flyhost"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19080

[services.development]
run = "pnpm --filter @workspace/flyhost run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/flyhost", "run", "build" ]
publicDir = "artifacts/flyhost/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19080"
BASE_PATH = "/"
